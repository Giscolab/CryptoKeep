name: Security fuzzing (synthetic)

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault-format:
    name: Jazzer.js coverage-guided vault-format fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Fail if system cryptographic randomness is unavailable
        run: node -e "require('node:crypto').randomBytes(16); console.log('CSPRNG OK')"
      - name: Replay all committed synthetic corpus inputs
        run: npm run fuzz:regression
      - name: Run bounded property-based fuzzing
        run: npm run fuzz:properties
      - name: Run Jazzer.js coverage-guided fuzzing (2 minutes)
        run: npm run fuzz:jazzer
